<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오늘의 샐러드</title>
<style>
:root{--p:#176b3a;--pd:#0d4b29;--ps:#e8f6ed;--tx:#17221c;--mu:#6b776f;--ln:#dce6df;--shadow:0 15px 42px rgba(25,63,40,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--tx);background:linear-gradient(180deg,#eaf4ee,#fafbfa 350px);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{width:calc(100% - 24px);max-width:940px;margin:auto;padding:18px 0 70px}.hero,.card{margin-bottom:17px;border-radius:25px}.hero{padding:31px;color:#fff;background:linear-gradient(135deg,#0d4827,#18713d 62%,#2d8a50);box-shadow:0 20px 48px rgba(16,76,42,.21)}.hero h1{margin:0 0 7px;font-size:clamp(2rem,6vw,2.6rem)}.hero p{margin:0 0 19px;color:rgba(255,255,255,.88)}.card{padding:25px;background:rgba(255,255,255,.95);border:1px solid var(--ln);box-shadow:var(--shadow)}h2,h3,p{margin-top:0}h2{margin-bottom:6px}.muted{color:var(--mu)}.actions,.chips{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn,.pick,.chip,input{font:inherit;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:14px;padding:11px}.btn,.pick,.chip{font-weight:800;cursor:pointer;text-decoration:none;-webkit-tap-highlight-color:transparent}.hero .btn{color:var(--pd)}.primary{color:#fff!important;background:linear-gradient(135deg,var(--p),#23854a)!important;border-color:transparent!important}.wide{width:100%;min-height:55px}.pick{min-height:58px}.active{color:var(--pd);background:var(--ps);border-color:#58a777}.summary{display:grid;gap:8px}.summary div{display:grid;grid-template-columns:115px minmax(0,1fr);gap:10px}.summary strong,.store{color:var(--p)}.hidden{display:none!important}.notice{padding:12px;background:#fff7df;color:#734b00}.store-status{margin:11px 0 0;padding:10px 12px;border-radius:12px;background:#f1f8f4;color:#155b32;font-weight:800}.special-store{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:17px}.menu-card{position:relative;display:block!important;width:100%!important;min-width:0!important;height:auto!important;min-height:210px!important;padding:19px;border:1px solid var(--ln);border-radius:18px;background:#fff;box-shadow:0 8px 24px rgba(25,63,40,.05);visibility:visible!important;opacity:1!important;transform:none!important}.menu-card.best{border:2px solid #3a965c;background:linear-gradient(145deg,#fff,#f3fbf6)}.rank{position:absolute;right:14px;top:14px;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:var(--ps);color:var(--p);font-weight:900}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;color:var(--p);background:#ddf4e6;font-size:.84rem;font-weight:900}.store{margin-top:8px;font-weight:850}.menu-card h3{margin:7px 38px 4px 0;font-size:1.08rem}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.fact{padding:8px;background:#f7faf8;border-radius:10px;font-size:.9rem}.sauce{padding:9px 11px;border-radius:11px;background:#fff7df;color:#694801;font-size:.9rem}.menu-card .btn{width:100%;margin-top:12px}.history article{padding:12px 0;border-bottom:1px solid var(--ln)}.modalbg{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.53);align-items:flex-end}.modalbg.open{display:flex}.modal{width:100%;max-width:820px;max-height:92vh;overflow:auto;margin:auto;padding:23px;background:#fff;border-radius:25px 25px 0 0}.field{margin:15px 0}.field>strong{display:block;margin-bottom:7px}.savebar{position:sticky;bottom:0;padding-top:13px;background:#fff}.render-status{margin-top:10px;color:var(--mu);font-size:.82rem}
@media(min-width:700px){.stores{grid-template-columns:repeat(3,minmax(0,1fr))}.modalbg{align-items:center;padding:20px}.modal{border-radius:25px}}
@media(max-width:650px){.card{padding:21px 18px;overflow:visible!important}.special-store{grid-template-columns:1fr}.summary div{grid-template-columns:95px minmax(0,1fr)}#resultSection{display:block;width:100%!important;min-height:150px!important;overflow:visible!important;contain:none!important;content-visibility:visible!important}#resultSection.hidden{display:none!important}.results{display:flex!important;flex-direction:column!important;width:100%!important;height:auto!important;max-height:none!important;overflow:visible!important;visibility:visible!important;opacity:1!important;contain:none!important}.menu-card{display:block!important;position:relative!important;flex:0 0 auto!important;width:100%!important;min-height:220px!important;max-height:none!important;overflow:visible!important;visibility:visible!important;opacity:1!important}.toolbar{align-items:flex-start}.toolbar>.btn{width:100%}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><h1>오늘의 샐러드</h1><p>한 개만 강요하지 않고, 목적에 맞는 후보를 여러 개 비교해보세요.</p><div class="actions"><button id="openPref" type="button" class="btn">⚙ 취향 설정</button><a class="btn" href="order-admin.html">단체 주문방 관리</a></div></section>
<section id="errorBox" class="card notice hidden"></section>
<section class="card"><h2>저장된 취향</h2><div id="summary"></div></section>
<section class="card"><h2>1. 매장 선택</h2><p class="muted">전체 매장을 선택하면 매장 종류까지 넓게 비교합니다.</p><div id="stores" class="grid stores"></div><div id="storeStatus" class="store-status"></div></section>
<section class="card"><h2>2. 식사 목적</h2><p id="target" class="muted"></p><div id="goals" class="grid"></div></section>
<button id="recommend" type="button" class="btn primary wide">조건에 맞는 메뉴 여러 개 보기</button>
<section id="resultSection" class="card hidden"><div class="toolbar"><div><h2>추천 후보</h2><p id="candidateInfo" class="muted"></p></div><button id="shuffle" type="button" class="btn">후보 순서 섞기</button></div><div id="results" class="results"></div><div id="renderStatus" class="render-status"></div></section>
<section class="card"><h2>최근 결정</h2><div id="history" class="history"></div></section>
</main>
<div id="modal" class="modalbg"><div class="modal"><h2>내 취향 설정</h2><div class="field"><strong>좋아하는 단백질</strong><div id="proteins" class="chips"></div></div><div class="field"><strong>좋아하는 추가 재료</strong><div id="extras" class="chips"></div></div><div class="field"><strong>제외 재료</strong><div id="excluded" class="chips"></div></div><div class="field"><strong>써브웨이 선호 빵</strong><div id="breads" class="grid"></div></div><div class="field"><strong>매장별 개인 취향</strong><div id="storePrefs" class="chips"></div></div><div class="savebar actions"><button id="closePref" type="button" class="btn">닫기</button><button id="resetPref" type="button" class="btn">초기화</button><button id="savePref" type="button" class="btn primary">취향 저장</button></div></div></div>
<script>
(function(){'use strict';
var raw=[['prep','프레퍼스',[['pcp','치킨 샐러드 파스타',8900,411,43,'발사믹 드레싱',['chicken','pasta']],['ppp','포크 샐러드 파스타',8900,437,44,'발사믹 드레싱',['pork','pasta']],['pbp','비프 샐러드 파스타',13900,578,50,'발사믹 드레싱',['beef','pasta']],['pdt','치킨 데리야끼 덮밥',9900,492,44,'데리야끼 소스',['chicken','grain']],['pcc','치킨 커리 덮밥',9900,591,44,'커리 소스',['chicken','grain']],['ppc','포크 커리 덮밥',10900,622,45,'커리 소스',['pork','grain']],['pbc','비프 커리 덮밥',13900,731,51,'커리 소스',['beef','grain']]]],['salady','샐러디',[['sr','로스트닭다리살 샐러디',12000,259,13.2,'시저 드레싱',['chicken']],['ss','그라브락스 연어 샐러디',13700,247,21,'레몬 오리엔탈',['salmon']],['sb','우삼겹메밀면 누들볼',10700,407,18,'참깨 드레싱',['beef','buckwheat']],['sp','고소삼겹 들기름파스타 누들볼',10900,445,16,'들기름 소스',['pork','pasta']]]],['poke','포케올데이',[['pt','곡물밥 스파이시 참치 포케',12900,623,33.5,'유자 간장',['tuna','grain','spicy']],['pd','곡물밥 훈제오리 포케',11900,732,25.2,'크리미 어니언',['grain']]]],['slow','슬로우캘리',[['sl','클래식 연어 포케',12500,569,30,'클래식 간장',['salmon','grain','seaweed']]]],['subway','써브웨이',[['se','에그마요 15cm',6200,453,16.9,'스위트 칠리 + 허니 머스타드',['egg','mayo','onion','tomato','olive']],['src','로티세리 바비큐 치킨 15cm',7800,328,29.1,'스위트 어니언 + 후추',['chicken','onion','tomato','olive']],['ssh','쉬림프 15cm',8200,281,16.3,'스위트 칠리 + 허니 머스타드',['shrimp','onion','tomato','olive']],['sst','스테이크 & 치즈 15cm',8500,452,28.5,'사우스웨스트 치폴레',['beef','onion']]]]];
var STORES=raw.map(function(s){return{id:s[0],name:s[1],menus:s[2].map(function(x){return{id:x[0],name:x[1],price:x[2],kcal:x[3],protein:x[4],sauce:x[5],ing:x[6]}})}}),TARGET={diet:{name:'다이어트',min:250,max:450,p:18},protein:{name:'고단백',min:300,max:700,p:30},light:{name:'가볍게',min:200,max:400,p:12},filling:{name:'든든하게',min:500,max:800,p:25},balanced:{name:'균형 있게',min:350,max:650,p:20},any:{name:'아무거나',min:0,max:9999,p:0}},L={chicken:'닭고기',pork:'돼지고기',beef:'소고기',salmon:'연어',tuna:'참치',shrimp:'새우',egg:'계란',tofu:'두부',avocado:'아보카도',pasta:'파스타면',buckwheat:'메밀면',grain:'곡물밥',mushroom:'버섯',sweetPotato:'고구마',pumpkin:'단호박',corn:'옥수수',cheese:'치즈',seaweed:'해초',natto:'낫또',onion:'양파',tomato:'토마토',olive:'올리브',nuts:'견과류',mayo:'마요네즈',spicy:'매운 재료',flatbread:'플랫브레드',white:'화이트',wheat:'위트',parmesan:'파마산 오레가노',honeyOat:'허니오트',avoidPrepPork:'프레퍼스 돼지고기 덜 추천',avoidPrepRice:'프레퍼스 밥 메뉴 덜 추천'};
function $(id){return document.getElementById(id)}function clone(v){return JSON.parse(JSON.stringify(v))}function read(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v===null?d:v}catch(e){return d}}function money(v){return String(Math.round(Number(v)||0)).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'원'}function labels(a){return a.map(function(x){return L[x]||x}).join(' · ')}function defaults(){return{proteins:['chicken','salmon','egg'],extras:['avocado','pasta'],excluded:['seaweed','natto'],bread:'flatbread',storePrefs:['avoidPrepPork','avoidPrepRice']}}
var pref=Object.assign({},defaults(),read('salad.preferences',{})),draft=clone(pref),storeId='random',goal='balanced',pool=[],shown=[];
function fail(title,e){$('errorBox').classList.remove('hidden');$('errorBox').innerHTML='<strong>'+title+'</strong><br>'+((e&&e.message)?e.message:String(e))}
function renderSummary(){$('summary').innerHTML='<div class="summary"><div><strong>단백질</strong><span>'+labels(pref.proteins)+'</span></div><div><strong>추가 재료</strong><span>'+labels(pref.extras)+'</span></div><div><strong>제외 재료</strong><span>'+labels(pref.excluded)+'</span></div><div><strong>써브웨이 빵</strong><span>'+L[pref.bread]+'</span></div><div><strong>매장 취향</strong><span>'+labels(pref.storePrefs)+'</span></div></div>'}
function renderStores(){var html='<div class="special-store"><button type="button" class="pick '+(storeId==='random'?'active':'')+'" data-store="random">🧭 전체 매장 후보 보기</button><button type="button" class="pick" id="randomStore">🎲 매장 랜덤 선택</button></div>';STORES.forEach(function(s){html+='<button type="button" class="pick '+(storeId===s.id?'active':'')+'" data-store="'+s.id+'">'+s.name+'</button>'});$('stores').innerHTML=html;Array.prototype.forEach.call(document.querySelectorAll('[data-store]'),function(b){b.onclick=function(){storeId=b.getAttribute('data-store');renderStores()}});$('randomStore').onclick=function(){storeId=STORES[Math.floor(Math.random()*STORES.length)].id;renderStores()};var found=STORES.filter(function(s){return s.id===storeId})[0];$('storeStatus').textContent=storeId==='random'?'현재 선택 · 전체 매장의 메뉴를 비교합니다.':'현재 선택 · '+(found?found.name:'')}
function renderGoals(){var html='';Object.keys(TARGET).forEach(function(k){html+='<button type="button" class="pick '+(goal===k?'active':'')+'" data-goal="'+k+'">'+TARGET[k].name+'</button>'});$('goals').innerHTML=html;Array.prototype.forEach.call(document.querySelectorAll('[data-goal]'),function(b){b.onclick=function(){goal=b.getAttribute('data-goal');renderGoals();renderTarget()}})}function renderTarget(){var t=TARGET[goal];$('target').textContent=t.min?'목표 '+t.min+'~'+t.max+'kcal · 단백질 '+t.p+'g 이상을 우선합니다.':'칼로리 제한 없이 취향을 우선합니다.'}
function score(s,m){var t=TARGET[goal],center=(t.min+t.max)/2,half=Math.max(1,(t.max-t.min)/2),kcal=goal==='any'?28:Math.max(0,30-(Math.abs(m.kcal-center)/half)*18),protein=goal==='any'?20:Math.min(26,(m.protein/Math.max(1,t.p))*22),taste=Math.min(18,m.ing.filter(function(x){return pref.proteins.indexOf(x)>=0}).length*9+m.ing.filter(function(x){return pref.extras.indexOf(x)>=0}).length*5),penalty=0;if(s.id==='prep'&&pref.storePrefs.indexOf('avoidPrepPork')>=0&&m.ing.indexOf('pork')>=0)penalty+=10;if(s.id==='prep'&&pref.storePrefs.indexOf('avoidPrepRice')>=0&&m.ing.indexOf('grain')>=0)penalty+=8;return Math.max(0,Math.min(100,28+kcal+protein+taste-penalty))}
function fact(text){var x=document.createElement('div');x.className='fact';x.textContent=text;return x}
function createCard(item,index){var a=document.createElement('article');a.className='menu-card'+(index===0?' best':'');var r=document.createElement('span');r.className='rank';r.textContent=String(index+1);a.appendChild(r);if(index===0){var b=document.createElement('span');b.className='badge';b.textContent='가장 잘 맞음';a.appendChild(b)}var st=document.createElement('div');st.className='store';st.textContent=item.s.name;a.appendChild(st);var h=document.createElement('h3');h.textContent=item.m.name;a.appendChild(h);var fs=document.createElement('div');fs.className='facts';fs.appendChild(fact('🔥 '+item.m.kcal+' kcal'));fs.appendChild(fact('💪 '+item.m.protein+'g'));fs.appendChild(fact('💰 '+money(item.m.price)));fs.appendChild(fact('적합도 '+Math.round(item.score)+'점'));a.appendChild(fs);var sc=document.createElement('div');sc.className='sauce';sc.textContent='추천 소스 · '+item.m.sauce;a.appendChild(sc);var bt=document.createElement('button');bt.type='button';bt.className='btn'+(index===0?' primary':'');bt.textContent='이 메뉴로 결정';bt.onclick=function(){choose(item)};a.appendChild(bt);return a}
function recommend(){var button=$('recommend');try{$('errorBox').classList.add('hidden');button.disabled=true;button.textContent='추천 메뉴를 찾는 중...';var selected=storeId==='random'?STORES:STORES.filter(function(s){return s.id===storeId});pool=[];selected.forEach(function(s){s.menus.forEach(function(m){if(!m.ing.some(function(x){return pref.excluded.indexOf(x)>=0}))pool.push({s:s,m:m,score:score(s,m)})})});pool.sort(function(a,b){return b.score-a.score});shown=pool.slice(0,6);renderResults()}catch(e){fail('추천 오류',e)}finally{button.disabled=false;button.textContent='조건에 맞는 메뉴 여러 개 보기'}}
function renderResults(){try{var section=$('resultSection'),out=$('results');section.classList.remove('hidden');out.innerHTML='';$('candidateInfo').textContent='총 '+pool.length+'개 후보 중 '+shown.length+'개를 보여드립니다.';shown.forEach(function(item,i){out.appendChild(createCard(item,i))});var cards=out.querySelectorAll('.menu-card'),visible=0;for(var i=0;i<cards.length;i++){var rect=cards[i].getBoundingClientRect();if(rect.width>10&&rect.height>10)visible++}$('renderStatus').textContent='표시 상태: '+cards.length+'개 생성 / '+visible+'개 화면 표시';if(cards.length&&visible===0){out.style.display='block';for(i=0;i<cards.length;i++){cards[i].style.cssText='display:block!important;position:static!important;width:100%!important;min-height:220px!important;margin:0 0 13px!important;visibility:visible!important;opacity:1!important;transform:none!important'}}setTimeout(function(){section.scrollIntoView({behavior:'smooth',block:'start'})},100)}catch(e){fail('결과 표시 오류',e)}}
function choose(item){var h=read('salad.history',[]);h.unshift({d:new Date().toISOString(),store:item.s.name,menu:item.m.name,price:item.m.price,kcal:item.m.kcal,sauce:item.m.sauce});localStorage.setItem('salad.history',JSON.stringify(h.slice(0,5)));renderHistory();alert(item.s.name+' · '+item.m.name+'으로 결정했습니다.')}
function renderHistory(){var h=read('salad.history',[]);if(!h.length){$('history').innerHTML='<p class="muted">아직 결정한 메뉴가 없습니다.</p>';return}var html='';h.forEach(function(x){html+='<article><strong>'+x.store+' · '+x.menu+'</strong><br>'+money(x.price)+' · '+x.kcal+'kcal · '+x.sauce+'</article>'});$('history').innerHTML=html}
function chips(id,items,key){var html='';items.forEach(function(x){html+='<button type="button" class="chip '+(draft[key].indexOf(x)>=0?'active':'')+'" data-key="'+key+'" data-value="'+x+'">'+L[x]+'</button>'});$(id).innerHTML=html;Array.prototype.forEach.call($(id).querySelectorAll('button'),function(b){b.onclick=function(){var k=b.getAttribute('data-key'),v=b.getAttribute('data-value'),i=draft[k].indexOf(v);if(i>=0)draft[k].splice(i,1);else draft[k].push(v);renderPrefs()}})}
function renderPrefs(){chips('proteins',['chicken','pork','beef','salmon','tuna','shrimp','egg','tofu'],'proteins');chips('extras',['avocado','pasta','buckwheat','grain','mushroom','sweetPotato','pumpkin','corn','cheese'],'extras');chips('excluded',['seaweed','natto','onion','tomato','olive','nuts','mayo','spicy'],'excluded');chips('storePrefs',['avoidPrepPork','avoidPrepRice'],'storePrefs');var html='';['flatbread','white','wheat','parmesan','honeyOat'].forEach(function(x){html+='<button type="button" class="pick '+(draft.bread===x?'active':'')+'" data-bread="'+x+'">'+L[x]+'</button>'});$('breads').innerHTML=html;Array.prototype.forEach.call(document.querySelectorAll('[data-bread]'),function(b){b.onclick=function(){draft.bread=b.getAttribute('data-bread');renderPrefs()}})}
$('openPref').onclick=function(){draft=clone(pref);renderPrefs();$('modal').classList.add('open')};$('closePref').onclick=function(){$('modal').classList.remove('open')};$('resetPref').onclick=function(){draft=defaults();renderPrefs()};$('savePref').onclick=function(){pref=clone(draft);localStorage.setItem('salad.preferences',JSON.stringify(pref));renderSummary();$('modal').classList.remove('open')};$('recommend').onclick=recommend;$('shuffle').onclick=function(){shown=pool.slice().sort(function(){return Math.random()-.5}).slice(0,6);renderResults()};
try{renderSummary();renderStores();renderGoals();renderTarget();renderHistory()}catch(e){fail('초기화 오류',e)}
})();
</script>
</body>
</html>
